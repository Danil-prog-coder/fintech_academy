# Платформа «вопросы по документации» — три независимых сервиса, у каждого свой docker-compose.yml:
#
#   services/llm    — скрытый RAG-сервис (агент, гибридный поиск, кэши). Наружу не публикуется.
#   services/admin  — ядро платформы: открытый API /v1, сайт для владельцев, админов и ТП. Порт ${ADMIN_PORT:-3001}.
#   services/mail   — демо-интеграция: почтовый клиент, работает с платформой через /v1. Порт ${MAIL_PORT:-3000}.
#
# Сервисы не ждут друг друга при старте: без llm работает admin, без admin — почта (недоступное отвечает ошибкой).
# Связь — через общие сети: platform_rag (admin ↔ llm), platform_api (интеграции → admin), platform_web (Caddy).
#
#   всё:                   docker compose up -d --build
#   один сервис:           docker compose up -d --build admin-web     (поднимет admin, его базу и Redis)
#   сервис из его папки:   docker compose -f services/admin/docker-compose.yml up -d --build
#
# Перед первым запуском: python scripts/setup_env.py (services/*/.env с согласованными секретами).

name: platform

include:
  - services/llm/docker-compose.yml
  - services/admin/docker-compose.yml
  - services/mail/docker-compose.yml
