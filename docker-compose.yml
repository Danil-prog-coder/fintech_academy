# Базовый compose — совместим с App Platform (Timeweb): без volumes, env_file и опубликованных
# портов 80/443. Сайт — ПЕРВЫЙ сервис (платформа проксирует на домен только его).
#
# Секреты и ключи задаются переменными окружения (в панели платформы или в shell):
#   SECRET_KEY, ENCRYPTION_KEY, GIGACHAT_CREDENTIALS, DATABASE_URL и т.д. (список ниже).
# Локально:  docker compose up --build   — подхватит docker-compose.override.yml
#   (там же back-end/.env, том для БД и порт API). Подробнее — README.md.
#
# БД: по умолчанию Postgres из этого файла БЕЗ тома — данные пропадут при пересоздании контейнера.
# Для продакшена задайте DATABASE_URL на управляемую БД (расширение pgvector обязательно).
x-backend-env: &backend-env
  environment:
    DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://resheno:resheno@postgres:5432/resheno}
    SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-dev-secret-change-me}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:-KdwktotoZM8Cjv6nemrset9fAdzGA7w0G-g_rUg9Bqo=}
    GIGACHAT_CA_BUNDLE: ${GIGACHAT_CA_BUNDLE:-certs/russian_trusted_root_ca.crt}
    # Без значения — переменная передаётся из окружения, если задана (иначе её берёт back-end/.env).
    GIGACHAT_CREDENTIALS:
    GIGACHAT_AUTH_KEY:  # алиас GIGACHAT_CREDENTIALS
    GIGACHAT_SCOPE:
    GIGACHAT_VERIFY_SSL:
    API_KEY:  # ключ Cloud.ru для эмбеддингов (алиас CLOUDRU_API_KEY)
    CLOUDRU_API_KEY:
    EMBEDDINGS_PROVIDER:
    LLM_PRIMARY:
    LLM_FALLBACK:
    QA_MODE:
    YANDEX_API_KEY:
    YANDEX_FOLDER_ID:
    YANDEX_MODEL:
    GITHUB_WEBHOOK_SECRET:
    PUBLIC_BASE_URL:

services:
  frontend:
    build: ./frontend
    depends_on:
      api: {condition: service_healthy}
    ports: ["3000:80"]
    restart: unless-stopped

  api:
    build: ./back-end
    <<: *backend-env
    depends_on:
      postgres: {condition: service_healthy}
    command: sh -c "python -m scripts.migrate && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*' --no-access-log"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  worker:
    build: ./back-end
    <<: *backend-env
    depends_on:
      api: {condition: service_healthy}  # api применяет миграции
    command: python -m app.worker
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: resheno
      POSTGRES_PASSWORD: resheno
      POSTGRES_DB: resheno
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resheno"]
      interval: 5s
      retries: 10
    restart: unless-stopped
