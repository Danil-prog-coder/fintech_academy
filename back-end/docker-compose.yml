services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: resheno
      POSTGRES_PASSWORD: resheno
      POSTGRES_DB: resheno
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resheno"]
      interval: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8000:8000"]
  # worker добавится вместе с индексацией
volumes:
  pgdata:
