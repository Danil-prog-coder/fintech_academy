# Справочные данные продукта для проекта по умолчанию (FR-ARCH-03: настройки на уровне проекта).
# Код сервиса не содержит названий документов, номеров разделов и готовых ответов: всё, что относится
# к конкретному продукту, лежит здесь и в базе знаний. Файл можно заменить через PRODUCT_FILE.

# Сокращения названий документов, которые пользователи пишут вместо полного названия
aliases:
  бо: барс офис
  bo: барс офис
  барсофис: барс офис

# Внутренние ссылки продукта (FR-INP-03). Названия документов для расшифровки транслита берутся
# из базы знаний (заголовки, разделы, подписи на скриншотах), а не из этого файла.
links:
  hosts:
    bo.bars.group: БАРС-Офис (bo.bars.group)
    bp.bars.group: Бизнес-процессы (bp.bars.group)
  actions:
    mainmenuitemclick: открытие документа (пункта главного меню)
  modules:
    bars_office: БАРС-Офис
  id_pattern: "[0-9A-Fa-f]{32}"
  id_description: 32-символьный hex GUID
  # что агенту стоит поискать в базе, чтобы объяснить пользователю, что делать со ссылкой
  search_hints:
    - ссылка на документ с настроенным фильтром
    - доступ к документу, заявка в техподдержку
    - доступ из внешней среды

# Синтаксис фильтров (FR-INP-04): справочник как структурированные данные
filters:
  product: БО
  column_operators:
    ">": больше — числа и даты
    "<": меньше — числа и даты
    "=": равно — числа, даты и текст
    "!=": не равно — числа, даты и текст
  text_operators: ["=", "!="]
  unsupported:
    "!>": «не больше» — такого оператора нет
    "!<": «не меньше» — такого оператора нет
    ">=": «больше или равно» — такого оператора нет
    "=>": «больше или равно» — такого оператора нет
    "<=": «меньше или равно» — такого оператора нет
    "=<": «меньше или равно» — такого оператора нет
    "<>": «не равно» в стиле SQL — используется «!=»
    "==": двойное равно — используется «=»
  date_format: dd.mm.yyyy
  manual_list: in A|B|C — после «in» обязателен пробел, между значениями и «|» пробелов нет
  empty_values: «in » (in + пробел) или в некоторых случаях «in _-_»
  editor_hint: в редакторе фильтров
  editor_group_categories: [и, или, не и, не или]
  search_hints:
    - фильтрация по столбцам, операторы сравнения
    - редактор фильтров, группы условий

# Сокращения для системного промпта агента (раздел «Глоссарий»)
glossary:
  БО: БАРС-Офис
  БП: бизнес-процесс
  БЦ: бизнес-центр (подразделение)
  ОМ: офис-менеджер
  СТП: служба техподдержки
  РФ / РТ: Российская Федерация / Республика Татарстан
  ЕИС: единая информационная система (пространство документации)
