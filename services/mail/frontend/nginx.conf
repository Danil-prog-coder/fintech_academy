server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # mail-api резолвится при каждом запросе (DNS Docker), а не при старте: сайт поднимается и без API.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mail_api http://mail-api:8000;

    # API: /api/auth/login -> http://mail-api:8000/auth/login
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $mail_api;
        # Вложения письма идут base64 в JSON (до 25 МБ файлов), LLM отвечает долго.
        client_max_body_size 40m;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: любые маршруты react-router отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
