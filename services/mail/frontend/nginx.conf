# За caddy (HTTPS) схему берём из его заголовка, иначе бэкенд решит, что запрос пришёл по http.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API: /api/auth/login -> http://api:8000/auth/login
    location /api/ {
        proxy_pass http://mail-api:8000/;
        # Вложения письма идут base64 в JSON (до 25 МБ файлов), LLM отвечает долго.
        client_max_body_size 40m;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # SPA: любые маршруты react-router отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
