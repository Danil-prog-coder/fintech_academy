# Сайт администратора, API сайта и открытый API платформы — с одного домена.
# admin (FastAPI) доступен только через этот nginx; llm (RAG) наружу не публикуется вовсе.
# За caddy (HTTPS) схему берём из его заголовка, иначе бэкенд решит, что запрос пришёл по http.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 60m;

    location ~ ^/(panel/api|v1|jira|health)(/|$) {
        proxy_pass http://admin:8000;
        proxy_http_version 1.1;
        # ответы приходят потоком (SSE): без буферизации и с длинным таймаутом
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /docs { proxy_pass http://admin:8000/docs; }
    location = /openapi.json { proxy_pass http://admin:8000/openapi.json; }

    # SPA: любые маршруты react-router отдают index.html
    location / {
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy same-origin;
        try_files $uri $uri/ /index.html;
    }
}
