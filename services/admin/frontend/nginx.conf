# Сайт администратора, API сайта и открытый API платформы — с одного домена.
# admin (FastAPI) доступен только через этот nginx; llm (RAG) наружу не публикуется вовсе.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 60m;

    # admin резолвится при каждом запросе (DNS Docker), а не при старте: сайт поднимается, даже если API ещё нет,
    # и переживает перезапуск контейнера admin. Пока его нет — 502 на запросы API, сам сайт открывается.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $admin_api http://admin:8000;

    location ~ ^/(panel/api|v1|jira|health)(/|$) {
        proxy_pass $admin_api;
        proxy_http_version 1.1;
        # ответы приходят потоком (SSE): без буферизации и с длинным таймаутом
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs { proxy_pass $admin_api; }
    location = /openapi.json { proxy_pass $admin_api; }

    # SPA: любые маршруты react-router отдают index.html
    location / {
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy same-origin;
        try_files $uri $uri/ /index.html;
    }
}
